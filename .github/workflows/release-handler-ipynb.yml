name: Release ipynb handler

on:
  # Manual trigger — rerun the rolling release without a code change.
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages/handler-ipynb/**'
      # The shared Go SDK is compiled into this handler's binaries.
      - 'packages/go/**'
      - 'packages/renderer-ipynb/**'
      - 'packages/renderer-sdk/**'
      - 'packages/types/**'
      # Include this workflow so changes to how the release is built/published
      # actually trigger a rebuild.
      - '.github/workflows/release-handler-ipynb.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: forge-handler-ipynb_linux-amd64
          - goos: linux
            goarch: arm64
            asset: forge-handler-ipynb_linux-arm64
          - goos: darwin
            goarch: amd64
            asset: forge-handler-ipynb_darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: forge-handler-ipynb_darwin-arm64
          - goos: windows
            goarch: amd64
            asset: forge-handler-ipynb_windows-amd64.exe
          # Browser build for client-side (Tier B) diff. Standard Go wasm.
          - goos: js
            goarch: wasm
            asset: forge-handler-ipynb.wasm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/handler-ipynb/go.mod

      - name: Build
        working-directory: packages/handler-ipynb
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -mod=mod -trimpath -ldflags="-s -w" -o ${{ matrix.asset }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/handler-ipynb/${{ matrix.asset }}

  build-renderer:
    name: Build renderer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace deps
        run: npm ci

      - name: Build renderer (types → sdk → renderer)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build --workspace @fhr/types
          npm run build --workspace @fhr/renderer-sdk
          BUILD_SHA="$(git rev-parse --short HEAD)" npm run build --workspace @fhr/renderer-ipynb
          cp packages/renderer-ipynb/dist/renderer.js renderer-ipynb.js

      - name: Upload renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: renderer-ipynb.js
          path: renderer-ipynb.js

  release:
    name: Publish rolling release
    needs: [build, build-renderer]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing rolling release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ipynb-latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create rolling release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipynb-latest
          name: "ipynb (latest)"
          body: "Rolling release — always points to the latest build from main. Includes native binaries, the wasm build, and the renderer bundle."
          files: dist/*

  update-manifest:
    name: Update manifest build SHA
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # One step, re-applied from scratch on every attempt. Every handler's
      # release bumps this same file, and a change to a shared package
      # (packages/go, the SDK, the types) releases several handlers at once, so
      # main routinely moves under this job and a bare push was rejected as
      # non-fast-forward. Rebasing the bump commit is no answer either: the
      # handlers' lines are adjacent in manifest.toml, which git treats as a
      # conflict. So each attempt starts from the current main and rewrites
      # only this handler's line.
      - name: Bump build SHA in manifest.toml
        env:
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i 's/\(handler = "ipynb", build = "\)[^"]*"/\1'"$SHA"'"/' manifest.toml
            git add manifest.toml
            git diff --cached --quiet && exit 0
            git commit --quiet -m "chore: update ipynb build SHA to $SHA"
            git push --quiet origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "could not push the manifest bump after 5 attempts" >&2
          exit 1
